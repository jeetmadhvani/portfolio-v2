<!doctype html>
<html lang="en">
  <head>
    <script>
      if (
        sessionStorage.getItem("portfolio-scroll-target") === "work"
      ) {
        document.documentElement.style.backgroundColor = "#0A0A0A";
        document.body.style.backgroundColor = "#0A0A0A";
      }
    </script>

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Jeet Madhvani — Design Engineer</title>

    <meta
      name="description"
      content="Jeet Madhvani is a design engineer building thoughtful websites and digital experiences with a focus on design, interaction, and frontend development."
    />

    <meta name="author" content="Jeet Madhvani" />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta name="theme-color" content="#500000" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Jeet Madhvani - Creative Developer"
    />

    <meta
      property="og:description"
      content="I design and build websites with an unhealthy attention to detail."
    />

    <meta
      property="og:image"
      content="/og-image.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:site_name"
      content="Jeet Madhvani"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Jeet Madhvani — Design Engineer"
    />

    <meta
      name="twitter:description"
      content="Design engineer building thoughtful websites and digital experiences with a focus on design, interaction, and frontend development."
    />

    <meta
      name="twitter:image"
      content="/og-image.png"
    />

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
